name: Briefly quality check

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "trust-ui.js"
      - "scripts/fetch_canada_disclosures.py"
      - "markets-v2.js"
      - "story-detail.js"
      - "scripts/fetch_news.py"
      - "scripts/build_feed.py"
      - "scripts/corroborate_feed.py"
      - "scripts/edit_feed_with_jarvis.py"
      - "scripts/finalize_feed.py"
      - "scripts/refine_feed.py"
      - "scripts/update_history.py"
      - "scripts/build_market_intelligence.py"
      - "market-intelligence.json"
      - "history.json"
      - "index.html"
      - "style.css"
      - "briefly-v2.css"
      - "markets-v2.css"
      - "story-detail.css"
      - ".github/workflows/quality-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend JavaScript syntax
        run: |
          node --check app.js
          node --check trust-ui.js
          node --check markets-v2.js
          node --check story-detail.js
      - name: Check Python engines syntax
        run: |
          python -m py_compile scripts/fetch_news.py
          python -m py_compile scripts/build_feed.py
          python -m py_compile scripts/corroborate_feed.py
          python -m py_compile scripts/edit_feed_with_jarvis.py
          python -m py_compile scripts/finalize_feed.py
          python -m py_compile scripts/refine_feed.py
          python -m py_compile scripts/update_history.py
          python -m py_compile scripts/fetch_canada_disclosures.py
          python -m py_compile scripts/build_market_intelligence.py
      - name: Check event-memory contract
        run: |
          grep -q 'sourceQuality' scripts/refine_feed.py
          grep -q 'previousSummary' scripts/refine_feed.py
          grep -q 'changeSummary' scripts/refine_feed.py
          grep -q 'SNAPSHOT_RETENTION_HOURS' scripts/update_history.py
          grep -q 'corroboratedStories' scripts/corroborate_feed.py
          grep -q 'timelineFor' story-detail.js
          grep -q 'history.json' story-detail.js
          echo "Briefly event-memory, detail timeline and corroboration contracts present."
      - name: Check Markets Intelligence contract
        run: |
          python - <<'PY'
          import json
          with open('market-intelligence.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('engine') == 'Briefly Markets Intelligence v1'
          markets=data.get('markets') or {}
          for name, market in markets.items():
              assert name in {'Canada','India'}
              assert market.get('direction') in {'up','down','flat','mixed','unclear'}
              assert market.get('confidence') in {'high','medium','low'}
              assert isinstance(market.get('drivers'), list)
              for driver in market.get('drivers',[]):
                  assert driver.get('kind') in {'driver','context'}
          print('Markets Intelligence contract valid:', ', '.join(markets) if markets else 'seed awaiting first refresh')
          PY
          grep -q 'Yahoo Finance daily chart feed' scripts/build_market_intelligence.py
          grep -q 'kind":"driver|context' scripts/build_market_intelligence.py
          grep -q 'WHY IT MOVED' markets-v2.js
          grep -q 'Cause, not commentary' markets-v2.js
      - name: Check required UI assets
        run: |
          test -f index.html
          test -f style.css
          test -f briefly-v2.css
          test -f markets-v2.css
          test -f story-detail.css
          test -f trust-ui.js
          test -f markets-v2.js
          test -f story-detail.js
          grep -q 'app.js?v=3' index.html
          grep -q 'trust-ui.js?v=1' index.html
          grep -q 'briefly-v2.css?v=1' index.html
          grep -q 'markets-v2.js?v=1' index.html
          grep -q 'markets-v2.css?v=1' index.html
          grep -q 'story-detail.js?v=1' index.html
          grep -q 'story-detail.css?v=1' index.html
