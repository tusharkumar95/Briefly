name: Test Canada Moves discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * 1-5'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check discovery script syntax
        run: python -m py_compile scripts/test_canada_discovery.py
      - name: Discover Canadian early warning disclosures
        run: python scripts/test_canada_discovery.py
      - name: Validate discovery output
        run: |
          python - <<'PY'
          import json
          with open('moves-canada-candidates.json', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data.get('records'), list)
          assert all(item.get('verified') is False for item in data['records'])
          print('Candidate records validated:', len(data['records']))
          PY
      - name: Audit candidate announcements against published records
        run: python scripts/audit_canada_moves.py
      - name: Save discovery candidates
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moves-canada-discovery-test.json moves-canada-candidates.json moves-canada-audit.json
          git diff --cached --quiet || git commit -m "Save Canada Moves discovery test"
          git push
