name: Test Canada Moves discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '35 13 * * 1-5'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Discover Canadian early warning disclosures
        run: python scripts/test_canada_discovery.py
      - name: Save discovery candidates
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moves-canada-discovery-test.json moves-canada-candidates.json
          git diff --cached --quiet || git commit -m "Save Canada Moves discovery test"
          git push
