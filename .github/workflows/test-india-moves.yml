name: Test Briefly India Moves collector

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  india-moves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official NSE deal files
        run: python scripts/test_india_moves.py
      - name: Save collector test
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moves-india-test.json
          git diff --cached --quiet || git commit -m "Save India Moves collector test"
          git push
