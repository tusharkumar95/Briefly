name: Test Briefly Moves sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test official disclosure sources
        run: python scripts/test_moves_sources.py

      - name: Save test result
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moves-source-test.json
          git diff --cached --quiet || git commit -m "Save Moves source test"
          git push
