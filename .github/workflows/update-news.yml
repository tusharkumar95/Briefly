name: Update Briefly news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_news.py"
      - "scripts/build_feed.py"
      - "scripts/edit_feed_with_jarvis.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: briefly-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate news engine syntax
        run: |
          python -m py_compile scripts/fetch_news.py
          python -m py_compile scripts/build_feed.py
          python -m py_compile scripts/edit_feed_with_jarvis.py

      - name: Collect, extract, score and cluster news
        run: python scripts/build_feed.py

      - name: Jarvis editorial and verification gate
        env:
          JARVIS_URL: https://jarvis-ai-router.kumar-tushar95.workers.dev
        run: python scripts/edit_feed_with_jarvis.py

      - name: Validate published intelligence feed
        run: |
          python - <<'PY'
          import json, re

          SPORTS = re.compile(r'(?i)\b(hockey|nhl|nba|nfl|mlb|cfl|soccer|football|cricket|tennis|golf|playoffs?|senators|maple leafs|leafs|canadiens|oilers|flames|canucks|blue jays|raptors)\b|\b\d{1,2}-\d{1,2}\b')
          JUNK = re.compile(r'(?i)(leave a comment|share on facebook|read today[\x27’]s paper|subscribe|privacy policy|cookie policy|viral video|bollywood|hollywood|celebrity)')

          with open('data.json', encoding='utf-8') as f:
              data = json.load(f)

          stories = data.get('stories', [])
          assert data.get('engine') == 'Briefly Intelligence v2', data.get('engine')
          assert 1 <= len(stories) <= 10, len(stories)

          ids = set()
          for story in stories:
              assert story.get('id') and story['id'] not in ids, story.get('title')
              ids.add(story['id'])
              title = story.get('title', '')
              summary = story.get('summary', '')
              assert len(title) >= 15, story
              assert len(summary) >= 80, title
              assert len(story.get('why', '')) >= 25, title
              assert story.get('cat') in {'World','Canada','India','AI','Canadian Markets','Indian Markets'}, title
              assert story.get('source'), title
              assert story.get('url', '').startswith('http'), title
              assert isinstance(story.get('sources'), list) and story['sources'], title
              assert story.get('confidence') in {'high','medium','low'}, title
              assert story.get('status') in {'New','Updated'}, title
              assert not SPORTS.search(title + ' ' + summary[:220]), title
              assert not JUNK.search(summary), title
              summary_words = re.findall(r'[a-z0-9]+', summary.lower())
              title_words = re.findall(r'[a-z0-9]+', title.lower())
              assert summary_words != title_words, title

          print('Validated', len(stories), 'high-signal events')
          print('Jarvis-edited:', sum(s.get('editor') == 'Jarvis' for s in stories))
          print('Verified:', sum(bool(s.get('verified')) for s in stories))
          print('Categories:', {c: sum(s.get('cat') == c for s in stories) for c in sorted({s.get('cat') for s in stories})})
          PY

      - name: Commit updated feed safely
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Feed is unchanged."
            exit 0
          fi
          git commit -m "Publish Jarvis-edited Briefly feed"
          git pull --rebase origin main
          git push origin main
