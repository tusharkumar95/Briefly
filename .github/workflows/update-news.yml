name: Update Briefly news

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate news script syntax
        run: python -m py_compile scripts/fetch_news.py

      - name: Fetch and filter news
        run: python scripts/fetch_news.py

      - name: Validate published summaries
        run: |
          python - <<'PY'
          import json, re
          with open('data.json', encoding='utf-8') as f:
              stories = json.load(f).get('stories', [])
          for story in stories:
              title = re.findall(r'[a-z0-9]+', story['title'].lower())
              summary = re.findall(r'[a-z0-9]+', story['summary'].lower())
              assert len(story['summary']) >= 130, story['title']
              assert summary != title, story['title']
          print('Validated substantive summaries:', len(stories))
          PY

      - name: Commit updated feed
        run: |

          git config user.name "briefly-bot"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update live news"

          git push
