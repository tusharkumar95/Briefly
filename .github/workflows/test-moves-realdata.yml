name: Test Briefly Moves real data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-data-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe official transaction data
        run: python scripts/test_moves_realdata.py
      - name: Save result
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moves-realdata-test.json
          git diff --cached --quiet || git commit -m "Save Moves real-data test"
          git push
