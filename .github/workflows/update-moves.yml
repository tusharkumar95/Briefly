name: Update Briefly Moves

on:
  schedule:
    - cron: "30 12 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_moves.py"
      - "moves-canada-verified.json"
      - "moves-canada-sedi.json"
      - ".github/workflows/update-moves.yml"

permissions:
  contents: write

concurrency:
  group: briefly-moves
  cancel-in-progress: true

jobs:
  update-moves:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Python syntax
        run: python -m py_compile scripts/fetch_moves.py
      - name: Build Moves Intelligence
        run: python scripts/fetch_moves.py
      - name: Validate Moves output
        run: |
          python - <<'PY'
          import json
          with open('moves-intelligence.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('engine')=='Moves Intelligence v2'
          records=data.get('records',[])
          assert isinstance(records,list)
          for r in records:
              assert r.get('market') in ('India','Canada')
              assert r.get('direction') in ('BUY','SELL')
              assert 0 <= int(r.get('moveScore',0)) <= 100
              assert r.get('strength') in ('Exceptional','Strong','Worth watching','Low signal')
              assert r.get('sourceUrl')
          print('Validated',len(records),'Moves Intelligence records')
          PY
      - name: Publish generated Moves data safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_once() {
            git add moves.json moves-history.json moves-intelligence.json
            if git diff --cached --quiet; then
              echo "Moves data already current."
              return 0
            fi
            git commit -m "Update Moves Intelligence"
            git push origin HEAD:main
          }

          if publish_once; then
            exit 0
          fi

          echo "Main advanced while Moves was building. Regenerating from newest main instead of merging generated JSON."
          git fetch origin main
          git reset --hard origin/main
          python scripts/fetch_moves.py
          python - <<'PY'
          import json
          with open('moves-intelligence.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('engine')=='Moves Intelligence v2'
          for r in data.get('records',[]):
              assert r.get('market') in ('India','Canada')
              assert r.get('direction') in ('BUY','SELL')
              assert 0 <= int(r.get('moveScore',0)) <= 100
              assert r.get('sourceUrl')
          PY
          git add moves.json moves-history.json moves-intelligence.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Moves Intelligence"
          git push origin HEAD:main
