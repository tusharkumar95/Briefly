name: Test Briefly Canada Moves source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canada-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test official SEDAR+ access
        run: python scripts/test_canada_moves.py
      - name: Save Canada source test
        run: |
          git config user.name "briefly-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moves-canada-source-test.json
          git diff --cached --quiet || git commit -m "Save Canada Moves source test"
          git push
